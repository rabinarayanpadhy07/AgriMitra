spring.application.name=agrimitra-auth-service
server.port=${PORT:8080}

# Database Configuration (Aiven MySQL defaultdb with SSL)
spring.datasource.url=${DB_URL:jdbc:mysql://mysql-30774976-agrimitra.h.aivencloud.com:12619/defaultdb?sslMode=REQUIRED&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

