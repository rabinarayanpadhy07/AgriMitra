spring.application.name=agrimitra-auth-service
server.port=${PORT:8080}

# Database Configuration (Aiven MySQL defaultdb with SSL)
spring.datasource.url=${DB_URL:jdbc:mysql://mysql-30774976-agrimitra.h.aivencloud.com:12619/defaultdb?sslMode=REQUIRED&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# HikariCP Connection Pool Optimization for Aiven Cloud
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=ShopEasyHikariCP

# HTTP Compression (Reduces network payload size for faster UI response)
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=1024

# JWT Security Configuration (HMAC-SHA256 256-bit base64/hex key)
agrimitra.app.jwtSecret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
agrimitra.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}
shopeasy.app.jwtSecret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
shopeasy.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}

# Admin Bootstrap (promotes this registered user's account to ADMIN on startup if no admin exists yet)
shopeasy.app.adminBootstrapEmail=${ADMIN_BOOTSTRAP_EMAIL:}

# CORS Configuration (Allows Vercel, Render, and Localhost)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://*.onrender.com,https://*.vercel.app,https://agrimitraapp.vercel.app}

# Spring Mail (Gmail SMTP configuration)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# HTTP Email APIs (Recommended for Render Free Tier which blocks SMTP ports 25, 465, 587)
brevo.api.key=${BREVO_API_KEY:}
resend.api.key=${RESEND_API_KEY:}
resend.from.email=${RESEND_FROM_EMAIL:AgriMitra <onboarding@resend.dev>}

