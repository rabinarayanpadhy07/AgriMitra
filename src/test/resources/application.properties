spring.application.name=agrimitra-auth-service-test
server.port=0

# Database Configuration (In-Memory H2 in MySQL compatibility mode)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=VALUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=never

# JPA / Hibernate Configuration for H2
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT Security Configuration
agrimitra.app.jwtSecret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
agrimitra.app.jwtExpirationMs=86400000
shopeasy.app.jwtSecret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
shopeasy.app.jwtExpirationMs=86400000

# Admin Bootstrap
shopeasy.app.adminBootstrapEmail=

# CORS Configuration
cors.allowed-origins=http://localhost:*,http://127.0.0.1:*

# Spring Mail (Test dummy settings)
